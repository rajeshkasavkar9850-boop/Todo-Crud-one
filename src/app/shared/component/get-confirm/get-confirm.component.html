<div class="text-center p-3">
    <h3 class="mb-3 text-danger">
        Confirm Delete
    </h3>

    <p class="mb-4">
        {{getMsg || 'Are you sure, You want to remove this informatin..?'}}
    </p>
    <div class="d-flex justify-content-center gap-3">
        <button (click)="onClose(true)"
        mat-raised-button color="warn">Yes</button>

        <button (click)="onClose(false)"
        mat-raised-button color="primary">No</button>
    </div>
</div>
