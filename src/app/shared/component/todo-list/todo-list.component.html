

<ul class="list-group" *ngIf="todosArr.length > 0; else noTodo">
    <li *ngFor="let todo of todosArr; trackBy : trackByFun"
    class="list-group-item d-flex justify-content-between">
         <strong>{{todo.todoItem}}</strong>

         <div>
             <button (click)="onEditTodo(todo)"
             class="me-2" mat-mini-fab color="primary">
                <mat-icon>edit</mat-icon>
             </button>

             <button (click)="onRemove(todo.todoId)"
             mat-mini-fab color="warn">
                <mat-icon>delete</mat-icon>
             </button>
        </div>
    </li>

    
</ul>

<ng-template #noTodo>
    <p class="alert alert-info">No Todo Added yet !!</p>
</ng-template>
